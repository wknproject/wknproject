<!DOCTYPE html>
<html>

  <meta charset="utf-8">
  <script>
  // ---- Local preview mock of google.script.run (backend is Google Apps Script, not available here) ----
  (function(){
    var uid = function(){ return 'id-' + Math.random().toString(36).slice(2, 10); };
    var today = new Date();
    // Local-date components, not toISOString() (which converts to UTC first and can
    // report the wrong calendar day depending on timezone/time of day).
    var iso = function(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
    // Days-ago offsets, spread across the current cycle so recency (lastAt) actually varies
    // between repeated descriptions -- this is what the Quick Add sort/order demonstrates.
    // Sets an absolute local hour on that calendar day via the Date constructor, rather
    // than adding `hour` hours' worth of milliseconds to the current instant - the old
    // version could silently roll a "day(0, 15)" (today, 3pm) into tomorrow if the
    // preview happened to be loaded after 9pm local time, which briefly looked like a
    // real app bug (entries dated "today" not showing in what looked like today's
    // History group) when it was actually just this mock generating bad fake data.
    var day = function(n, hour) {
      return new Date(today.getFullYear(), today.getMonth(), today.getDate() - n, hour != null ? hour : 9, 0, 0, 0);
    };
    var mockState = {
      transactions: [
        // "Gojek to office" x4 -> highest count, shows first
        { id: uid(), createdAt: day(6,8).getTime(), date: iso(day(6)), category: 'Transport', description: 'Gojek to office', amount: 42000, group: 'Daily', source: 'GoPay' },
        { id: uid(), createdAt: day(5,8).getTime(), date: iso(day(5)), category: 'Transport', description: 'Gojek to office', amount: 45000, group: 'Daily', source: 'GoPay' },
        { id: uid(), createdAt: day(3,8).getTime(), date: iso(day(3)), category: 'Transport', description: 'Gojek to office', amount: 47000, group: 'Daily', source: 'GoPay' },
        { id: uid(), createdAt: day(1,8).getTime(), date: iso(day(1)), category: 'Transport', description: 'Gojek to office', amount: 45000, group: 'Daily', source: 'GoPay' },
        // "Coffee with friend" x3
        { id: uid(), createdAt: day(4,15).getTime(), date: iso(day(4)), category: 'Coffee', description: 'Coffee with friend', amount: 65000, group: 'Daily', source: 'BCA' },
        { id: uid(), createdAt: day(2,15).getTime(), date: iso(day(2)), category: 'Coffee', description: 'Coffee with friend', amount: 68000, group: 'Daily', source: 'BCA' },
        { id: uid(), createdAt: day(0,15).getTime(), date: iso(day(0)), category: 'Coffee', description: 'Coffee with friend', amount: 68000, group: 'Daily', source: 'BCA' },
        // "Indomaret run" x2
        { id: uid(), createdAt: day(5,19).getTime(), date: iso(day(5)), category: 'Food', description: 'Indomaret run', amount: 120000, group: 'Daily', source: 'Cash' },
        { id: uid(), createdAt: day(1,19).getTime(), date: iso(day(1)), category: 'Food', description: 'Indomaret run', amount: 150000, group: 'Daily', source: 'Cash' },
        // "Grab bike" x2 -- distinct from Gojek so it doesn't merge (memory keys on exact description text)
        { id: uid(), createdAt: day(3,18).getTime(), date: iso(day(3)), category: 'Transport', description: 'Grab bike', amount: 22000, group: 'Daily', source: 'Ovo' },
        { id: uid(), createdAt: day(0,18).getTime(), date: iso(day(0)), category: 'Transport', description: 'Grab bike', amount: 25000, group: 'Daily', source: 'Ovo' },
        // "Kopi Kenangan" x2
        { id: uid(), createdAt: day(4,10).getTime(), date: iso(day(4)), category: 'Coffee', description: 'Kopi Kenangan', amount: 28000, group: 'Daily', source: 'Ovo' },
        { id: uid(), createdAt: day(2,10).getTime(), date: iso(day(2)), category: 'Coffee', description: 'Kopi Kenangan', amount: 28000, group: 'Daily', source: 'Ovo' },
        // One-off descriptions -- logged only once each, so they never qualify for a Quick Add chip
        { id: uid(), createdAt: day(2,20).getTime(), date: iso(day(2)), category: 'Shopping', description: 'New charger cable', amount: 85000, group: 'Daily', source: 'Dana' },
        { id: uid(), createdAt: day(0,12).getTime(), date: iso(day(0)), category: 'Entertainment', description: 'Movie tickets', amount: 100000, group: 'Daily', source: 'BCA' },
        // Fixed items, logged once this cycle (matches Tracker_FixedItems by description)
        { id: uid(), createdAt: day(5,7).getTime(), date: iso(day(5)), category: 'Bills', description: 'Kosan', amount: 3000000, group: 'Bills', source: 'Mandiri' }
      ],
      budgets: { 'Jul - Aug': 10000000 },
      fixedItems: [
        { description: 'Kosan', category: 'Bills', expectedAmount: 3000000, active: true },
        { description: 'Cicilan', category: 'Bills', expectedAmount: 2000000, active: true },
        { description: 'Investasi', category: 'Investment', expectedAmount: 1000000, active: true }
      ],
      cycles: [
        { label: 'Mar - Apr', start: '2026-03-25', end: '2026-04-23' },
        { label: 'Apr - May', start: '2026-04-24', end: '2026-05-24' },
        { label: 'May - Jun', start: '2026-05-25', end: '2026-06-24' },
        { label: 'Jun - Jul', start: '2026-06-25', end: '2026-07-23' },
        { label: 'Jul - Aug', start: '2026-07-24', end: '2026-08-24' },
        { label: 'Aug - Sep', start: '2026-08-25', end: '2026-09-24' },
        { label: 'Sep - Oct', start: '2026-09-25', end: '2026-10-22' },
        { label: 'Oct - Nov', start: '2026-10-23', end: '2026-11-24' },
        { label: 'Nov - Dec', start: '2026-11-25', end: '2026-12-24' }
      ],
      userEmail: 'ghema@example.com'
    };

    function makeRunner(fnName, argsExpected) {
      return function() {
        var args = Array.prototype.slice.call(arguments);
        var self = this;
        setTimeout(function() {
          try {
            var result = mockBackend[fnName].apply(null, args);
            if (self._success) self._success(result);
          } catch (e) {
            if (self._failure) self._failure(e);
          }
        }, 150);
        return self;
      };
    }

    var mockBackend = {
      getAllData: function(){ return JSON.parse(JSON.stringify(mockState)); },
      addTransaction: function(entry) {
        mockState.transactions.push({ id: uid(), createdAt: Date.now(), date: entry.date, category: entry.category, description: entry.description, amount: Number(entry.amount), group: entry.group, source: entry.source || '' });
        return mockBackend.getAllData();
      },
      updateTransaction: function(id, entry) {
        var t = mockState.transactions.find(function(t){ return t.id === id; });
        if (t) {
          t.date = entry.date; t.category = entry.category; t.description = entry.description;
          t.amount = Number(entry.amount); t.group = entry.group; t.source = entry.source || '';
        }
        return mockBackend.getAllData();
      },
      deleteTransaction: function(id) {
        mockState.transactions = mockState.transactions.filter(function(t){ return t.id !== id; });
        return mockBackend.getAllData();
      },
      setBudget: function(cycleLabel, amount) {
        mockState.budgets[cycleLabel] = Number(amount);
        return mockBackend.getAllData();
      }
    };

    var runnerProto = {
      withSuccessHandler: function(fn) { this._success = fn; return this; },
      withFailureHandler: function(fn) { this._failure = fn; return this; }
    };
    ['getAllData','addTransaction','updateTransaction','deleteTransaction','setBudget'].forEach(function(name){
      runnerProto[name] = makeRunner(name);
    });

    window.google = {
      script: {
        run: Object.create(runnerProto)
      }
    };
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --primary: #1385ae; --bg: #F4F5F6; --card: #FFFFFF; --line: #E4E6E8;
      --ink: #414142; --muted: #6B6D70; --faint: #9CA0A3;

    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .headline { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::selection { background: #fdbc1555; }

    .demo-banner { background: var(--primary); color: #FFFFFF; text-align: center; font-size: 12.5px; padding: 10px 16px; line-height: 1.4; }
    .demo-banner a { color: var(--highlight); font-weight: 700; text-decoration: underline; white-space: nowrap; }
    .greeting-row { display: flex; align-items: center; gap: 10px; padding: 18px 16px 4px; }

    .greeting-text strong { color: var(--ink); font-weight: 700; }
    .header { background: var(--primary); color: var(--card); padding: 28px 20px 22px; margin: 12px 16px 8px; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); position: relative; overflow: hidden; }
    .header .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); }
    .header .ring.r1 { top: -30px; right: -30px; width: 140px; height: 140px; }
    .header .ring.r2 { top: -10px; right: -10px; width: 100px; height: 100px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; position: relative; z-index: 1; }
    .cycle-btn { display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.18); border: none; color: var(--card); padding: 8px 12px; border-radius: 20px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
    .eye-btn { background: rgba(255,255,255,0.08); border: none; border-radius: 8px; padding: 7px; display: flex; }
    .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; position: relative; z-index: 1; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-label { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .stat-row { display: flex; gap: 20px; position: relative; z-index: 1; }
    .stat-label { font-size: 11px; opacity: 0.55; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat-value { font-size: 22px; font-weight: 600; }
    .bar-track { height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; margin-top: 18px; position: relative; z-index: 1; }
    .bar-fill { height: 100%; background: var(--highlight); border-radius: 3px; transition: width 0.4s ease; }
    .bar-sub { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; position: relative; z-index: 1; }
    .bar-sub .days-left { color: var(--highlight); font-weight: 700; opacity: 1; }
    .bar-sub .spent-of { opacity: 0.6; }

    .tabs { display: flex; padding: 14px 20px 0; gap: 8px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
    .tab-btn { flex: 1; padding: 10px 0; border-radius: 10px; border: none; font-size: 13.5px; font-weight: 600; background: #E9EAEB; color: var(--muted); }
    .tab-btn.active { background: var(--primary); color: var(--card); }

    .content { padding: 18px 20px 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); font-weight: 600; margin-bottom: 14px; }
    label.field-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }
    .field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; background: #FAFAFB; color: var(--ink); }
    .amount-field { display: flex; align-items: center; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: #FAFAFB; }
    .amount-field .rp-prefix { font-size: 15px; font-weight: 700; color: var(--primary); margin-right: 4px; flex-shrink: 0; }
    .amount-field input { flex: 1; border: none; background: none; outline: none; font-size: 15px; color: var(--ink); padding: 0; min-width: 0; }
    .pill-row { display: flex; gap: 8px; margin: 16px 0 18px; flex-wrap: wrap; }
    .pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 6px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); font-size: 12px; font-weight: 500; color: var(--ink); }
    .pill-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .primary-btn { width: 100%; padding: 14px 0; border-radius: 12px; border: none; background: var(--highlight); color: var(--ink); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
    button:disabled { opacity: 0.7; }
    .btn-spinner { width: 15px; height: 15px; border: 2px solid rgba(65,65,66,0.35); border-top-color: var(--ink); border-radius: 50%; animation: btnspin 0.7s linear infinite; }
    .btn-spinner-danger { border-color: rgba(218,71,86,0.35); border-top-color: var(--alert); }
    @keyframes btnspin { to { transform: rotate(360deg); } }
    .ghost-btn { background: #E9EAEB; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; color: var(--muted); font-weight: 600; }

    .quick-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
    .chip { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; flex-shrink: 0; font-size: 12.5px; font-weight: 500; }
    .chip-badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .day-group { margin-bottom: 16px; }
    .day-head { display: flex; justify-content: space-between; padding: 0 2px 8px; align-items: baseline; font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .day-list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .tx-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #ECEDEE; }
    .tx-row:last-child { border-bottom: none; }
    .tx-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }
    .tx-desc { font-size: 14px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 11.5px; color: var(--faint); }
    .tx-amt { font-size: 14px; font-weight: 600; color: var(--ink); }

    .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 11px; color: var(--faint); font-weight: 500; }
    .cat-item.active { border-color: currentColor; }
    .src-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .src-item { padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-size: 13.5px; font-weight: 500; color: var(--muted); }
    .src-item.active { border-color: var(--highlight); background: #fdbc1518; color: #8a6410; font-weight: 600; }

    .sheet-overlay { position: fixed; inset: 0; background: rgba(27,42,74,0.42); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .sheet-overlay.show { display: flex; }
    .sheet { background: var(--card); width: 100%; max-width: 420px; border-radius: 20px; padding: 16px 18px 24px; max-height: 78vh; overflow-y: auto; }
    .sheet-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 14px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sheet-title { font-size: 15px; font-weight: 700; color: var(--primary); font-family: 'Plus Jakarta Sans', sans-serif; }
    .sheet-close { background: #ECEDEE; border: none; border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--card); padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,0.2); z-index: 120; display: none; }
    .toast.show { display: block; }

    .empty { text-align: center; padding: 60px 20px; color: var(--faint); }
    .footer-credit { text-align: center; padding: 24px 20px 12px; }
    .footer-credit .appname { font-size: 13px; font-weight: 700; color: #9CA0A3; margin-bottom: 2px; }
    .footer-credit .tagline { font-size: 12px; color: #B8BBBD; font-style: italic; margin-bottom: 2px; }

    .cycle-item.active { border-color: var(--highlight); background: #fdbc1514; }
  </style>

  // Cycle date ranges come from the Tracker_Cycles sheet (state.cycles, populated by

  // just adding a row in the Sheet - no code/deploy needed.

    { name: "Others", group: "Daily", icon: "dots", color: "#6B6D70" }
  ];
  var SOURCES = ["Ovo", "Dana", "BCA", "Jago", "Mandiri", "GoPay", "Cash"];
  var DEFAULT_BUDGET = 25000000;

  function svgIcon(name, size, color) {
    size = size || 16;
    color = color || 'currentColor';
    var inner = ICON_PATHS[name] || '';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" style="display:block;flex-shrink:0;color:' + color + ';">' + inner + '</svg>';
  }

  var state = { transactions: [], budgets: {}, fixedItems: [], cycles: [], selectedCycle: null, hideRemaining: localStorage.getItem('hideRemaining') === '1', userEmail: '' };
  var currentTab = 'log';
  var logForm = { category: 'Food', source: SOURCES[0], date: null };

  // Every google.script.run call returns the full getAllData() shape - apply it
  // consistently so cycles/budgets/etc. stay in sync no matter which action triggered it.
  function applyServerData(data) {
    state.transactions = data.transactions;
    state.budgets = data.budgets;
    state.fixedItems = data.fixedItems;
    state.cycles = data.cycles || [];
  }

  function todayISO() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function catByName(n) { return CATEGORIES.filter(function(c){return c.name===n;})[0]; }
  function normDesc(s) { return (s || '').trim().toLowerCase(); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function daysBetween(a, b) { return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000); }
  function dayLabel(d) { return new Date(d+'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' }); }
  function fmtIDR(n) {
    var neg = n < 0, v = Math.abs(Math.round(n));
    var s = 'Rp' + v.toLocaleString('id-ID');
    return neg ? '-' + s : s;
  }
  // Live thousand-separator formatting for amount inputs (Indonesian style: 1.500.000)
  function formatThousands(digitsStr) {
    return digitsStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function parseAmount(str) {
    var digits = String(str || '').replace(/[^0-9]/g, '');
    return digits ? parseInt(digits, 10) : 0;
  }
  function attachThousandsFormatting(input) {
    if (!input) return;
    input.addEventListener('input', function() {
      var digits = input.value.replace(/[^0-9]/g, '');
      input.value = digits ? formatThousands(digits) : '';
    });
  }
  function activeCycleFor(dateStr) {
    for (var i = 0; i < state.cycles.length; i++) {
      var c = state.cycles[i];
      if (dateStr >= c.start && dateStr <= c.end) return c;
    }
    if (state.cycles.length) return state.cycles[state.cycles.length - 1];
    // Tracker_Cycles sheet has no rows - fall back to a degenerate single-day cycle
    // instead of crashing, so a misconfigured sheet just looks odd rather than broken.
    return { label: '—', start: dateStr, end: dateStr };
  }
  function currentCycle() {
    if (state.selectedCycle) {
      for (var i = 0; i < state.cycles.length; i++) if (state.cycles[i].label === state.selectedCycle) return state.cycles[i];
    }
    return activeCycleFor(todayISO());
  }
  function buildMemory() {
    var map = {};
    var sorted = state.transactions.slice().sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
    sorted.forEach(function(t){
      var key = normDesc(t.description);
      if (!map[key]) map[key] = { count: 0 };
      map[key].category = t.category;
      map[key].source = t.source;
      map[key].amount = t.amount;
      map[key].displayDescription = t.description;
      map[key].count += 1;
      map[key].lastAt = t.createdAt || 0;
    });
    return map;
  }
  function lastSourceOverall() {
    var withSrc = state.transactions.filter(function(t){return t.source;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    return withSrc.length ? withSrc[0].source : SOURCES[0];
  }

  // Matches cycle transactions against the Fixed reference list by description
  // (case-insensitive), regardless of category. Returns fixed spend total,
  // and which active fixed items have/haven't been logged this cycle yet.
  function computeFixedStatus(cycleTx) {
    var activeItems = (state.fixedItems || []).filter(function(f){ return f.active; });
    var fixedBudgetTotal = activeItems.reduce(function(s,f){ return s + f.expectedAmount; }, 0);
    var loggedNames = {};
    var fixedSpent = 0;
    cycleTx.forEach(function(t) {
      var key = normDesc(t.description);
      var match = activeItems.filter(function(f){ return normDesc(f.description) === key; })[0];
      if (match) {
        fixedSpent += t.amount;
        loggedNames[key] = true;
      }
    });
    var missing = activeItems.filter(function(f){ return !loggedNames[normDesc(f.description)]; });
    var loggedCount = activeItems.length - missing.length;
    return {
      activeItems: activeItems,
      fixedBudgetTotal: fixedBudgetTotal,
      fixedSpent: fixedSpent,
      loggedCount: loggedCount,
      missing: missing
    };
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function isKeyboardLikelyOpen() {
    if (!window.visualViewport) return false;
    // Compare against the layout viewport (stable), not window.innerHeight, which can
    // itself shrink alongside the keyboard on some Android configurations and would
    // otherwise mask the difference we're trying to detect.
    var layoutHeight = document.documentElement.clientHeight;
    return (layoutHeight - window.visualViewport.height) > 120;
  }

  function syncOverlayToViewport() {
    var overlay = document.getElementById('sheetOverlay');
    if (window.visualViewport) {
      var vv = window.visualViewport;
      overlay.style.top = vv.offsetTop + 'px';
      overlay.style.left = vv.offsetLeft + 'px';
      overlay.style.width = vv.width + 'px';
      overlay.style.height = vv.height + 'px';
      overlay.style.right = 'auto';
      overlay.style.bottom = 'auto';
    } else {
      overlay.style.top = '0';
      overlay.style.left = '0';
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.right = 'auto';
      overlay.style.bottom = 'auto';
    }
  }
  var overlayVVSyncAttached = false;
  function attachOverlayViewportSync() {
    if (!window.visualViewport || overlayVVSyncAttached) return;
    window.visualViewport.addEventListener('resize', syncOverlayToViewport);
    window.visualViewport.addEventListener('scroll', syncOverlayToViewport);
    overlayVVSyncAttached = true;
  }
  function detachOverlayViewportSync() {
    if (!window.visualViewport || !overlayVVSyncAttached) return;
    window.visualViewport.removeEventListener('resize', syncOverlayToViewport);
    window.visualViewport.removeEventListener('scroll', syncOverlayToViewport);
    overlayVVSyncAttached = false;
  }

  function openSheet(title, bodyHtml) {
    function reveal() {
      document.getElementById('sheetTitle').textContent = title;
      document.getElementById('sheetBody').innerHTML = bodyHtml;
      syncOverlayToViewport();
      document.getElementById('sheetOverlay').classList.add('show');
      attachOverlayViewportSync();
    }

    // Blur whatever's focused regardless - harmless if nothing needs it, and starts
    // the keyboard-closing process as early as possible if something does.
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }

    if (!isKeyboardLikelyOpen()) {
      // No keyboard currently occupying the screen - safe to open immediately.
      reveal();
      return;
    }

    // Keyboard is physically still open (regardless of what currently has focus).
    // Wait for the visualViewport resize that fires once it finishes collapsing,
    // rather than guessing a fixed delay.
    if (window.visualViewport) {
      var settled = false;
      var vv = window.visualViewport;
      var onResize = function() {
        if (settled) return;
        if (isKeyboardLikelyOpen()) return; // still closing, keep waiting
        settled = true;
        vv.removeEventListener('resize', onResize);
        reveal();
      };
      vv.addEventListener('resize', onResize);
      // Fallback in case the resize event never fires as expected.
      setTimeout(function() {
        if (settled) return;
        settled = true;
        vv.removeEventListener('resize', onResize);
        reveal();
      }, 500);
    } else {
      setTimeout(reveal, 400);
    }
  }
  function closeSheet() {
    document.getElementById('sheetOverlay').classList.remove('show');
    detachOverlayViewportSync();
  }
  document.getElementById('sheetOverlay').addEventListener('click', function(e){
    if (e.target === this) closeSheet();
  });

  // ---------- Header ----------
  function renderHeader() {
    var cycle = currentCycle();
    var isCurrent = cycle.label === activeCycleFor(todayISO()).label;
    document.getElementById('cycleLabel').textContent = cycle.label + (isCurrent ? '' : ' (past/future)');
    document.getElementById('cycleChevron').innerHTML = svgIcon('chevrondown', 13, '#FFFFFF');
    document.getElementById('eyeBtn').innerHTML = svgIcon(state.hideRemaining ? 'eyeoff' : 'eye', 15, '#FFFFFF');

    var budget = state.budgets[cycle.label] != null ? state.budgets[cycle.label] : DEFAULT_BUDGET;
    var totalDays = daysBetween(cycle.start, cycle.end) + 1;
    var today = todayISO();
    var elapsed = clamp(daysBetween(cycle.start, today) + 1, 0, totalDays);
    var daysRemaining = Math.max(0, totalDays - elapsed);
    var cycleTx = state.transactions.filter(function(t){ return t.date >= cycle.start && t.date <= cycle.end; });
    var totalSpent = cycleTx.reduce(function(s,t){ return s + t.amount; }, 0);
    var remaining = budget - totalSpent;
    var overBudget = remaining < 0;
    var pct = Math.min(100, (totalSpent / budget) * 100);

    // Daily safe spend uses only the Daily portion of the budget, so it stays
    // stable instead of swinging when a big Fixed item (rent, installments, investments) gets logged.
    var fixedStatus = computeFixedStatus(cycleTx);
    var dailyBudget = budget - fixedStatus.fixedBudgetTotal;
    var dailySpent = totalSpent - fixedStatus.fixedSpent;
    var dailyRemaining = dailyBudget - dailySpent;
    var dailySafe = daysRemaining > 0 ? dailyRemaining / daysRemaining : dailyRemaining;

    document.getElementById('statusDot').style.background = overBudget ? 'var(--alert)' : 'var(--highlight)';
    document.getElementById('statusLabel').textContent = overBudget ? 'OVER BUDGET' : 'ON TRACK';
    document.getElementById('remainingVal').textContent = state.hideRemaining ? 'Rp••••••••' : fmtIDR(remaining);
    document.getElementById('remainingVal').style.color = overBudget ? '#FFD1CC' : '#FFFFFF';
    document.getElementById('dailyVal').textContent = state.hideRemaining ? 'Rp••••••' : fmtIDR(dailySafe);
    document.getElementById('dailyVal').style.color = dailySafe < 0 ? '#FFD1CC' : '#fdbc15';
    document.getElementById('barFill').style.width = pct + '%';
    document.getElementById('barFill').style.background = overBudget ? '#da4756' : '#fdbc15';
    document.getElementById('spentOfBudget').textContent = state.hideRemaining ? '••• of •••' : (fmtIDR(totalSpent) + ' of ' + fmtIDR(budget));
    document.getElementById('daysLeft').textContent = daysRemaining + ' day' + (daysRemaining !== 1 ? 's' : '') + ' left';

    return { cycle: cycle, budget: budget, cycleTx: cycleTx, totalSpent: totalSpent, fixedStatus: fixedStatus };
  }

  document.getElementById('eyeBtn').addEventListener('click', function() {
    state.hideRemaining = !state.hideRemaining;
    localStorage.setItem('hideRemaining', state.hideRemaining ? '1' : '0');

        (active ? '<span style="color:#fdbc15;">' + svgIcon('check', 16, '#fdbc15', 2.4) + '</span>' : '') + '</div>';

  function renderLogTab() {

      .filter(function(m){ return m.count >= 2; })
      .sort(function(a,b){ return b.count - a.count || b.lastAt - a.lastAt; })
      .slice(0, 8);

    var cat = catByName(logForm.category) || CATEGORIES[3];

    document.getElementById('content').innerHTML = chipsHtml +

        '<button class="pill" id="catPillBtn" onclick="openCategoryPicker()"><span class="pill-badge" id="catPillBadge" style="background:' + cat.color + '22;">' + svgIcon(cat.icon, 13, cat.color) + '</span><span id="catPillLabel">' + logForm.category + '</span>' + svgIcon('chevronright', 12, '#9CA0A3') + '</button>' +
        '<button class="pill" onclick="openSourcePicker()"><span class="pill-badge" id="srcPillBadge" style="background:#fdbc1522;">' + svgIcon('wallet', 13, '#8a6410') + '</span><span id="srcPillLabel">' + logForm.source + '</span>' + svgIcon('chevronright', 12, '#9CA0A3') + '</button>' +
        '<button class="pill" onclick="openDatePicker()" style="padding:8px 12px;"><span id="datePillLabel">' + (isToday ? 'Today' : logForm.date) + '</span>' + svgIcon('chevronright', 12, '#9CA0A3') + '</button>' +
      '</div>' +
      '<button class="primary-btn" id="submitBtn" onclick="submitEntry()">' + svgIcon('plus', 16, '#414142', 2.4) + '<span>Add entry</span></button>' +
      '</div>';

    document.getElementById('descInput').addEventListener('input', function(e) {
      var match = memory[normDesc(e.target.value)];
      if (match && e.target.value.trim().length > 1) {
        logForm.category = match.category;
        logForm.source = match.source || logForm.source;
        document.getElementById('catPillLabel').textContent = logForm.category;
        document.getElementById('srcPillLabel').textContent = logForm.source;
      }
    });
    attachThousandsFormatting(document.getElementById('amtInput'));
  }

  function applyQuickChip(encodedDesc) {
    var desc = decodeURIComponent(encodedDesc);
    var memory = buildMemory();
    var m = memory[normDesc(desc)];
    if (!m) return;
    logForm.category = m.category;
    logForm.source = m.source || logForm.source;
    renderLogTab();
    document.getElementById('descInput').value = m.displayDescription;
    document.getElementById('amtInput').value = formatThousands(String(m.amount));
    document.getElementById('amtInput').focus();
  }

  function openCategoryPicker() {
    var html = '<div class="cat-grid">' + CATEGORIES.map(function(c) {
      var active = c.name === logForm.category;
      return '<div class="cat-item' + (active ? ' active' : '') + '" style="color:' + c.color + (active ? ';background:' + c.color + '18' : '') + '" onclick="pickCategory(\'' + c.name + '\')">' +
        svgIcon(c.icon, 18, c.color) + '<span>' + c.name + '</span></div>';
    }).join('') + '</div>';
    openSheet('Category', html);
  }
  function pickCategory(name) {
    logForm.category = name;
    closeSheet();
    document.getElementById('catPillLabel').textContent = name;
    var c = catByName(name) || CATEGORIES[3];
    var badge = document.getElementById('catPillBadge');
    if (badge) {
      badge.style.background = c.color + '22';
      badge.innerHTML = svgIcon(c.icon, 13, c.color);
    }
  }
  function openSourcePicker() {
    var html = '<div class="src-row">' + SOURCES.map(function(s) {
      var active = s === logForm.source;
      return '<div class="src-item' + (active ? ' active' : '') + '" onclick="pickSource(\'' + s + '\')">' + s + '</div>';
    }).join('') + '</div>';
    openSheet('Source of fund', html);
  }
  function pickSource(s) {
    logForm.source = s;
    closeSheet();
    document.getElementById('srcPillLabel').textContent = s;
  }
  function openDatePicker() {
    openSheet('Date', '<input type="date" class="field" id="dateInputSheet" value="' + logForm.date + '" onchange="pickDate(this.value)">');
  }
  function pickDate(v) {
    logForm.date = v;
    closeSheet();
    document.getElementById('datePillLabel').textContent = v === todayISO() ? 'Today' : v;
  }

  function submitEntry() {
    var btn = document.getElementById('submitBtn');
    if (btn.disabled) return; // already submitting
    var desc = document.getElementById('descInput').value.trim();
    var amt = parseAmount(document.getElementById('amtInput').value);
    if (!desc || !amt || amt <= 0) { showToast('Enter a description and amount'); return; }
    var cat = catByName(logForm.category);
    var entry = { date: logForm.date, category: logForm.category, description: desc, amount: amt, group: cat ? cat.group : 'Daily', source: logForm.source };
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span><span>Adding...</span>';
    google.script.run.withSuccessHandler(function(data) {
      applyServerData(data);
      showToast('Logged ' + fmtIDR(amt));
      logForm.date = todayISO();
      renderAll(); // re-renders the Log tab from scratch, so the button comes back fresh
    }).withFailureHandler(function(err) {
      showToast('Save failed: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = svgIcon('plus', 16, '#414142', 2.4) + '<span>Add entry</span>';
    }).addTransaction(entry);
  }

  // ---------- History tab ----------
  function renderHistoryTab(cycleTx) {
    if (!cycleTx.length) {
      document.getElementById('content').innerHTML = '<div class="empty">No entries yet this cycle.<br><span style="font-size:12.5px;">Log your first spend from the Log tab.</span></div>';
      return;
    }
    var byDate = {};
    cycleTx.forEach(function(t) { (byDate[t.date] = byDate[t.date] || []).push(t); });
    Object.keys(byDate).forEach(function(date) {
      byDate[date].sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
    });
    var dates = Object.keys(byDate).sort().reverse();

    var html = dates.map(function(date) {
      var items = byDate[date];
      var dayTotal = items.reduce(function(s,t){ return s+t.amount; }, 0);
      var rows = items.map(function(t) {
        var c = catByName(t.category) || CATEGORIES[7];
        return '<div class="tx-row">' +
          '<div class="tx-icon" style="background:' + c.color + '18;">' + svgIcon(c.icon, 15, c.color) + '</div>' +
          '<div style="flex:1;min-width:0;" onclick="openEditSheet(\'' + t.id + '\')">' +
            '<div class="tx-desc">' + escapeHtml(t.description) + '</div>' +
            '<div class="tx-meta">' + t.category + (t.source ? ' · ' + t.source : '') + '</div>' +
          '</div>' +
          '<div class="num tx-amt">' + fmtIDR(t.amount) + '</div>' +
          '<button onclick="openEditSheet(\'' + t.id + '\')" style="background:none;border:none;color:#C7BEA8;padding:4px;display:flex;">' + svgIcon('pencil', 14, '#C7BEA8') + '</button>' +
        '</div>';
      }).join('');
      return '<div class="day-group"><div class="day-head"><span>' + dayLabel(date) + ' · ' + date + '</span><span class="num">' + fmtIDR(dayTotal) + '</span></div><div class="day-list">' + rows + '</div></div>';
    }).join('');

    document.getElementById('content').innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function openEditSheet(id) {
    var t = state.transactions.filter(function(x){ return x.id === id; })[0];
    if (!t) return;
    var catHtml = CATEGORIES.map(function(c) {
      var active = c.name === t.category;
      return '<div class="cat-item' + (active?' active':'') + '" style="color:' + c.color + (active ? ';background:'+c.color+'18':'') + '" onclick="editSetField(\'category\',\''+c.name+'\')" id="editcat-'+c.name+'">' +
        svgIcon(c.icon, 18, c.color) + '<span>'+c.name+'</span></div>';
    }).join('');
    var srcHtml = SOURCES.map(function(s) {
      var active = s === t.source;
      return '<div class="src-item'+(active?' active':'')+'" onclick="editSetField(\'source\',\''+s+'\')" id="editsrc-'+s+'">'+s+'</div>';
    }).join('');

    var html =
      '<label class="field-label">Description</label>' +
      '<input class="field" id="editDesc" value="' + escapeHtml(t.description) + '" style="margin-bottom:12px;">' +
      '<div style="display:flex;gap:10px;margin-bottom:14px;">' +
        '<div style="flex:1;"><label class="field-label">Amount</label><div class="amount-field"><span class="rp-prefix">Rp</span><input class="num" id="editAmt" inputmode="numeric" value="' + formatThousands(String(t.amount)) + '"></div></div>' +
        '<div style="flex:1;"><label class="field-label">Date</label><input type="date" class="field num" id="editDate" value="' + t.date + '"></div>' +
      '</div>' +
      '<label class="field-label">Category</label><div class="cat-grid" style="margin-bottom:14px;">' + catHtml + '</div>' +
      '<label class="field-label">Source of fund</label><div class="src-row" style="margin-bottom:20px;">' + srcHtml + '</div>' +
      '<div style="display:flex;gap:10px;">' +
        '<button id="deleteEditBtn" onclick="deleteEntry(\''+id+'\')" style="padding:13px 18px;border-radius:12px;border:1px solid #F3C3BE;background:#FCE9E7;color:#da4756;font-weight:600;display:flex;align-items:center;gap:6px;">' + svgIcon('trash', 15, '#da4756') + '<span>Delete</span></button>' +
        '<button class="primary-btn" id="saveEditBtn" onclick="saveEdit(\''+id+'\')" style="flex:1;">' + svgIcon('check', 16, '#414142', 2.4) + '<span>Save changes</span></button>' +
      '</div>';
    openSheet('Edit entry', html);
    window._editState = { id: id, category: t.category, source: t.source };
    attachThousandsFormatting(document.getElementById('editAmt'));
  }
  function editSetField(field, value) {
    window._editState[field] = value;
    document.querySelectorAll(field === 'category' ? '.cat-item' : '.src-item').forEach(function(el){ el.classList.remove('active'); });
    document.getElementById((field === 'category' ? 'editcat-' : 'editsrc-') + value).classList.add('active');
  }
  function saveEdit(id) {
    var saveBtn = document.getElementById('saveEditBtn');
    if (saveBtn.disabled) return; // already submitting
    var desc = document.getElementById('editDesc').value.trim();
    var amt = parseAmount(document.getElementById('editAmt').value);
    var date = document.getElementById('editDate').value;
    if (!desc || !amt || amt <= 0) { showToast('Fill description and amount'); return; }
    var cat = catByName(window._editState.category);
    var entry = { date: date, category: window._editState.category, description: desc, amount: amt, group: cat ? cat.group : 'Daily', source: window._editState.source };
    var delBtn = document.getElementById('deleteEditBtn');
    saveBtn.disabled = true;
    if (delBtn) delBtn.disabled = true;
    saveBtn.innerHTML = '<span class="btn-spinner"></span><span>Saving...</span>';
    google.script.run.withSuccessHandler(function(data) {
      applyServerData(data);
      closeSheet(); showToast('Entry updated'); renderAll();
    }).withFailureHandler(function(err){
      showToast('Save failed: ' + err.message);
      saveBtn.disabled = false;
      if (delBtn) delBtn.disabled = false;
      saveBtn.innerHTML = svgIcon('check', 16, '#414142', 2.4) + '<span>Save changes</span>';
    }).updateTransaction(id, entry);
  }
  function deleteEntry(id) {
    var delBtn = document.getElementById('deleteEditBtn');
    if (delBtn.disabled) return; // already submitting
    var saveBtn = document.getElementById('saveEditBtn');
    delBtn.disabled = true;
    if (saveBtn) saveBtn.disabled = true;
    delBtn.innerHTML = '<span class="btn-spinner btn-spinner-danger"></span><span>Deleting...</span>';
    google.script.run.withSuccessHandler(function(data) {
      applyServerData(data);
      closeSheet(); showToast('Entry deleted'); renderAll();
    }).withFailureHandler(function(err){
      showToast('Delete failed: ' + err.message);
      delBtn.disabled = false;
      if (saveBtn) saveBtn.disabled = false;
      delBtn.innerHTML = svgIcon('trash', 15, '#da4756') + '<span>Delete</span>';
    }).deleteTransaction(id);
  }

  // ---------- Breakdown tab ----------
  function renderBreakdownTab(cycle, budget, cycleTx, totalSpent, fixedStatus) {
    var byCat = {};
    cycleTx.forEach(function(t){ byCat[t.category] = (byCat[t.category]||0) + t.amount; });
    var rows = CATEGORIES.map(function(c) {
      var total = byCat[c.name] || 0;
      var pct = totalSpent > 0 ? (total/totalSpent*100) : 0;
      return { c: c, total: total, pct: pct };
    }).sort(function(a,b){ return b.total - a.total; });

    var rowsHtml = rows.map(function(r) {
      return '<div class="breakdown-row">' +
        '<div class="breakdown-top"><span style="display:flex;align-items:center;gap:6px;">' + svgIcon(r.c.icon, 14, r.c.color) + '<span>' + r.c.name + '</span></span>' +
        '<span><span class="num">' + fmtIDR(r.total) + '</span> <span class="num" style="color:#9CA0A3;font-size:11px;">' + r.pct.toFixed(0) + '%</span></span></div>' +
        '<div class="breakdown-track"><div class="breakdown-fill" style="width:' + r.pct + '%;background:' + r.c.color + ';"></div></div>' +
      '</div>';
    }).join('');

    var fx = fixedStatus || { activeItems: [], fixedBudgetTotal: 0, loggedCount: 0, missing: [] };
    var allLogged = fx.activeItems.length > 0 && fx.missing.length === 0;
    var fixedHtml = '';
    if (fx.activeItems.length > 0) {
      var missingHtml = fx.missing.map(function(f) {
        return '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#B5482F;padding:3px 0;">' + svgIcon('circle', 9, '#B5482F', 2) + '<span>' + f.description + ' <span class="num" style="color:#9CA0A3;">(' + fmtIDR(f.expectedAmount) + ')</span></span></div>';
      }).join('');
      var loggedHtml = fx.activeItems.filter(function(f){ return fx.missing.indexOf(f) === -1; }).map(function(f) {
        return '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#1385ae;padding:3px 0;">' + svgIcon('circledot', 9, '#1385ae') + '<span>' + f.description + '</span></div>';
      }).join('');
      fixedHtml =
        '<div class="card" style="margin-bottom:16px;">' +
        '<div class="eyebrow" style="margin-bottom:8px;">Fixed items this cycle</div>' +
        '<div style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:' + (allLogged ? '#1385ae' : '#B5482F') + ';margin-bottom:8px;">' +
          (allLogged ? svgIcon('check', 15, '#1385ae', 2.4) : '') +
          '<span>' + fx.loggedCount + ' of ' + fx.activeItems.length + ' logged' + (allLogged ? ' — all set' : '') + '</span>' +
        '</div>' +
        loggedHtml + missingHtml +
        '<div style="font-size:11px;color:#9CA0A3;margin-top:8px;">Fixed budget baseline: <span class="num">' + fmtIDR(fx.fixedBudgetTotal) + '</span> · Manage this list in the Tracker_FixedItems sheet.</div>' +
        '</div>';
    }

    document.getElementById('content').innerHTML =
      '<div class="card" style="margin-bottom:16px;"><div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<div><div class="eyebrow" style="margin-bottom:4px;">Budget · ' + cycle.label + '</div>' +
      '<div class="num" style="font-size:20px;font-weight:600;color:#1385ae;">' + fmtIDR(budget) + '</div></div>' +
      '<button class="ghost-btn" onclick="editBudget(\'' + cycle.label + '\',' + budget + ')">Edit</button></div></div>' +
      fixedHtml +
      '<div class="eyebrow" style="padding-left:2px;">Category breakdown</div>' +
      '<div class="card" style="padding:6px 16px;">' + rowsHtml + '</div>';
  }
  function editBudget(cycleLabel, current) {
    var v = prompt('New budget for ' + cycleLabel + ' (Rp)', current);
    if (v === null) return;
    var amount = parseAmount(v);
    if (!amount || amount <= 0) { showToast('Enter a valid amount'); return; }
    google.script.run.withSuccessHandler(function(data) {
      applyServerData(data); showToast('Budget updated'); renderAll();
    }).withFailureHandler(function(err){ showToast('Save failed: ' + err.message); }).setBudget(cycleLabel, amount);
  }

  // ---------- Render orchestration ----------
  function renderContent() {
    var h = renderHeader();
    if (currentTab === 'log') renderLogTab();
    else if (currentTab === 'history') renderHistoryTab(h.cycleTx);
    else if (currentTab === 'breakdown') renderBreakdownTab(h.cycle, h.budget, h.cycleTx, h.totalSpent, h.fixedStatus);
  }
  var GREETINGS = [
    "Ready to track", "Let's log spend", "Track today's spend", "Keeping tabs",
    "Money check-in", "Let's log something", "Spend check", "Back to tracking",
    "Wallet check-in", "Time to log", "Cycle check-in", "Tracking mode on"
  ];
  function renderGreeting() {
    var email = state.userEmail || '';
    var namePart = email.split('@')[0] || '';
    var words = namePart ? namePart.split(/[._-]+/) : [];
    var firstName = words.length ? (words[0].charAt(0).toUpperCase() + words[0].slice(1)) : '';
    var initial = firstName ? firstName.charAt(0).toUpperCase() : (email ? email.charAt(0).toUpperCase() : '•');
    var greeting = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];

    document.getElementById('avatarInitial').textContent = initial;

    document.getElementById('greetingText').innerHTML = firstName
      ? greeting + ', <strong>' + firstName + '</strong>'
      : (email ? greeting + ', <strong>' + email + '</strong>' : greeting);
  }
  function renderAll() {
    renderHeader();
    renderContent();
  }

  google.script.run.withSuccessHandler(function(data) {
    applyServerData(data);
    state.userEmail = data.userEmail || '';
    renderGreeting();
    renderAll();
  }).withFailureHandler(function(err) {
    document.getElementById('content').innerHTML = '<div class="empty">Couldn\'t load data: ' + err.message + '</div>';
  }).getAllData();
</script>
</body>
</html>
